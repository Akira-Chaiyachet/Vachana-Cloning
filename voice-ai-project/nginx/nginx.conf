events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;
    sendfile      on;
    client_max_body_size 50M;

    # logs (เปิดไว้ช่วยดีบั๊ก; ถ้าเรียบร้อยแล้วค่อยปิด)
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log main;
    error_log   /var/log/nginx/error.log  warn;

    # สำหรับ Upgrade เป็น WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ===== Upstreams =====
    upstream django_http {
        server web:8000;
    }
    upstream django_asgi {
        server channels:8001;
    }
    upstream voice_gateway {
        server gateway:8010;
    }

    # ===== HTTPS server =====
    server {
        listen 443 ssl;
        http2  on;                         # รูปแบบใหม่แทน "listen ... http2"
        server_name _;

        ssl_certificate     /etc/nginx/certs/nginx-selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/nginx-selfsigned.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # -------- Static / Media / Dist --------
        location /static/ {
            alias /app/frontend/staticfiles/;
            expires 1d;
            autoindex off;
        }
        location /media/ {
            alias /app/frontend/media/;
            expires 1d;
            autoindex off;
        }
        location /dist/ {
            alias /app/frontend/dist/;
            expires 1d;
            autoindex off;
        }

        # -------- Voice Gateway (WebSocket) --------
        # กรณีพาธเป๊ะ /ws/voice
        location = /ws/voice {
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_buffering     off;
            proxy_pass http://voice_gateway;
        }
        # กันผู้ใช้เรียก /ws/voice/ (มี slash) → ส่งให้แอปที่พาธ /ws/voice
        location = /ws/voice/ {
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_buffering     off;
            proxy_pass http://voice_gateway/ws/voice;
        }

        # -------- Django Channels (WebSocket) --------
        # รองรับทั้ง /ws/rtc/<room>/ และ /ws/room/<id>/
        location ~ ^/ws/(rtc|room)/ {
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_buffering     off;
            proxy_pass http://django_asgi;
        }

        # -------- Django HTTP ปกติ --------
        location / {
            proxy_pass http://django_http;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout  600s;
            proxy_send_timeout  600s;
        }
    }

    # ===== HTTP → HTTPS redirect =====
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }
}
