version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "until mysqladmin ping -h db --silent; do sleep 5; done &&
             python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    working_dir: /app/frontend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=RVC_DJ.settings
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs
      - ./frontend/staticfiles:/app/frontend/staticfiles
      - ./frontend/media:/app/frontend/media
      - ./frontend/dist:/app/frontend/dist
    depends_on:
      - web

  db:
    image: mysql:8.0
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: voice_ai
      MYSQL_USER: django_user
      MYSQL_PASSWORD: VC@V-ai2025
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"

  stt:
    build:
      context: .
      dockerfile: Dockerfile.stt
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - .:/app
      - whisper_models:/root/.cache/whisper
    working_dir: /app/backend/stt
    ports:
      - "8001:8000"
    command: >
      sh -c "uvicorn main:app --host 0.0.0.0 --port 8000"

  mt:
    build:
      context: .
      dockerfile: Dockerfile.mt
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - .:/app
      - mt_models:/root/.cache/huggingface
    working_dir: /app/backend/mt
    ports:
      - "8002:8000"
    command: >
      sh -c "uvicorn main:app --host 0.0.0.0 --port 8000"

  tts:
    build:
      context: .
      dockerfile: Dockerfile.tts
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - .:/app
      - xtts_models:/root/.cache/tts
    working_dir: /app/backend/tts
    ports:
      - "8003:8000"
    command: >
      sh -c "uvicorn main:app --host 0.0.0.0 --port 8000"

volumes:
  db_data:
  whisper_models:
  mt_models:
  xtts_models:
